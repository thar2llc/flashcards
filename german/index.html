<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Blitz Flashcards — 30-Day Blitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="site-header">
  <div>
    <div class="header-brand">🇩🇪 German Blitz Flashcards</div>
    <div class="header-sub">180 Phrases · 6 Weeks · Beginner</div>
  </div>
  <a href="../" class="header-back">← All Decks</a>
</header>

<div class="page-inner">

  <!-- Week filter -->
  <div class="week-tabs" id="weekTabs">
    <button class="week-tab active" data-week="0">All 180</button>
    <button class="week-tab" data-week="1">Week 1</button>
    <button class="week-tab" data-week="2">Week 2</button>
    <button class="week-tab" data-week="3">Week 3</button>
    <button class="week-tab" data-week="4">Week 4</button>
    <button class="week-tab" data-week="5">Week 5</button>
    <button class="week-tab" data-week="6">Week 6</button>
  </div>

  <!-- Controls -->
  <div class="controls-row">
    <button class="ctrl-btn" id="shuffleBtn">Shuffle</button>
    <button class="ctrl-btn" id="studyModeBtn">Study Mode: All</button>
    <button class="ctrl-btn" id="resetBtn">Reset</button>
  </div>

  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat-pill">Remaining <span id="statRemain">180</span></div>
    <div class="stat-pill">Known <span id="statKnown">0</span></div>
    <div class="stat-pill">Review <span id="statReview">0</span></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" style="margin-bottom:4px;">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div style="font-size:.7rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:16px;">
    <span id="progressText">0 of 180 reviewed</span>
    <span id="progressPct">0%</span>
  </div>

  <!-- Card -->
  <div class="card-area" id="cardArea">
    <div class="flip-card" id="flipCard">
      <div class="flip-inner">
        <div class="card-face card-front">
          <div class="card-badge" id="cardBadge">Day 1 · W1</div>
          <div class="card-eyebrow">GERMAN</div>
          <div class="card-main-text" id="cardGerman">—</div>
          <div class="card-tap-hint">tap to reveal</div>
        </div>
        <div class="card-face card-back">
          <div class="card-badge-back" id="cardBadgeBack">Day 1 · W1</div>
          <div class="card-eyebrow-back">ENGLISH</div>
          <div class="card-main-back" id="cardEnglish">—</div>
          <div class="card-pron" id="cardPron">—</div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="btn" id="prevBtn">← Prev</button>
      <span class="card-counter" id="cardCounter">1 / 180</span>
      <button class="btn primary" id="nextBtn">Next →</button>
    </div>

    <div class="verdict-row" id="verdictRow" style="display:none;">
      <button class="verdict-btn again" id="againBtn">↩ Again</button>
      <button class="verdict-btn know"  id="knowBtn">✓ Got it</button>
    </div>
  </div>

  <!-- Done -->
  <div class="done-screen" id="doneScreen">
    <div style="font-family:'Playfair Display',serif;font-size:2.5rem;color:var(--gold);">★</div>
    <div class="done-title">Deck Complete!</div>
    <div class="done-sub">You've reviewed all the cards in this set.</div>
    <div class="done-stats">
      <div class="done-stat"><div class="done-stat-n" id="doneKnown">0</div><div class="done-stat-label">Known</div></div>
      <div class="done-stat"><div class="done-stat-n" id="doneReview">0</div><div class="done-stat-label">For Review</div></div>
      <div class="done-stat"><div class="done-stat-n" id="donePct">0%</div><div class="done-stat-label">Mastered</div></div>
    </div>
    <button class="btn primary" id="restartBtn" style="margin-top:6px;">Study Again</button>
    <button class="btn" id="reviewWrongBtn" style="margin-top:4px;">Review Missed Only</button>
  </div>

</div><!-- /page-inner -->

let queue=[], idx=0, known=new Set(), again=new Set(), flipped=false, studyMode='all', activeWeek=0;
const $=id=>document.getElementById(id);

function buildQueue(){
  let base=activeWeek===0?[...CARDS]:CARDS.filter(c=>c.week===activeWeek);
  if(studyMode==='again') base=base.filter(c=>again.has(c.german));
  queue=base; idx=0; known.clear(); again.clear(); render();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function render(){
  const done=known.size+again.size, total=queue.length, pct=total?Math.round(done/total*100):0;
  $('progressFill').style.width=pct+'%';
  $('progressText').textContent=`${done} of ${total} reviewed`;
  $('progressPct').textContent=pct+'%';
  $('statRemain').textContent=total-done;
  $('statKnown').textContent=known.size;
  $('statReview').textContent=again.size;
  if(idx>=queue.length){showDone();return;}
  const c=queue[idx];
  $('cardGerman').textContent=c.german;
  $('cardEnglish').textContent=c.english;
  $('cardPron').textContent=c.pron||'—';
  const b=`Day ${c.day} · W${c.week}`;
  $('cardBadge').textContent=b; $('cardBadgeBack').textContent=b;
  $('cardCounter').textContent=`${idx+1} / ${queue.length}`;
  $('flipCard').classList.remove('flipped'); flipped=false;
  $('verdictRow').style.display='none';
  $('prevBtn').disabled=idx===0; $('nextBtn').disabled=idx>=queue.length-1;
}
function showDone(){
  $('cardArea').style.display='none'; $('doneScreen').classList.add('visible');
  const k=known.size,a=again.size,t=queue.length;
  $('doneKnown').textContent=k; $('doneReview').textContent=a;
  $('donePct').textContent=t?Math.round(k/t*100)+'%':'0%';
}
function hideDone(){$('doneScreen').classList.remove('visible');$('cardArea').style.display='flex';}

$('flipCard').addEventListener('click',()=>{
  $('flipCard').classList.toggle('flipped'); flipped=!flipped;
  $('verdictRow').style.display=flipped?'flex':'none';
});
$('prevBtn').addEventListener('click',()=>{if(idx>0){idx--;render();}});
$('nextBtn').addEventListener('click',()=>{if(idx<queue.length-1){idx++;render();}});
$('knowBtn').addEventListener('click',()=>{known.add(queue[idx].german);again.delete(queue[idx].german);if(idx<queue.length-1){idx++;}else{render();showDone();return;}render();});
$('againBtn').addEventListener('click',()=>{again.add(queue[idx].german);known.delete(queue[idx].german);if(idx<queue.length-1){idx++;}else{render();showDone();return;}render();});
$('shuffleBtn').addEventListener('click',()=>{shuffle(queue);idx=0;render();hideDone();});
$('resetBtn').addEventListener('click',()=>{buildQueue();hideDone();});
$('restartBtn').addEventListener('click',()=>{buildQueue();hideDone();});
$('reviewWrongBtn').addEventListener('click',()=>{studyMode='again';$('studyModeBtn').textContent='Study Mode: Missed';$('studyModeBtn').classList.add('on');buildQueue();hideDone();});
$('studyModeBtn').addEventListener('click',()=>{studyMode=studyMode==='all'?'again':'all';$('studyModeBtn').textContent=studyMode==='all'?'Study Mode: All':'Study Mode: Missed';$('studyModeBtn').classList.toggle('on',studyMode==='again');buildQueue();hideDone();});
$('weekTabs').addEventListener('click',e=>{
  const btn=e.target.closest('.week-tab'); if(!btn)return;
  document.querySelectorAll('.week-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); activeWeek=parseInt(btn.dataset.week);
  studyMode='all';$('studyModeBtn').textContent='Study Mode: All';$('studyModeBtn').classList.remove('on');
  buildQueue();hideDone();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='l') $('nextBtn').click();
  if(e.key==='ArrowLeft' ||e.key==='h') $('prevBtn').click();
  if(e.key===' '||e.key==='Enter'){e.preventDefault();$('flipCard').click();}
  if(e.key==='1'&&flipped) $('knowBtn').click();
  if(e.key==='2'&&flipped) $('againBtn').click();
});
buildQueue();
</script>
